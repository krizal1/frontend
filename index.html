<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Frontend v1.0</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; }
        input, button { padding: 6px 10px; margin: 4px 0; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>Frontend v1.0</h1>
    <label>
        Текст:
        <input id="input" type="text" placeholder="Введите текст" />
    </label>
    <button id="send">Отправить</button>
    <h3>Ответ сервера:</h3>
    <pre id="log"></pre>

    <script>
        const API = "http://127.0.0.1:5000/api/data";
        document.getElementById("send").addEventListener("click", async () => {
            const text = document.getElementById("input").value;
            try {
                const res = await fetch(API, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text })
                });
                const data = await res.json();
                document.getElementById("log").textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                document.getElementById("log").textContent = "Ошибка: " + e.message;
            }
        });
    </script>
</body>
</html>
